jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip without Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "Daily sync waiting. Add GitHub secret VERCEL_TOKEN plus variables VERCEL_ORG_ID and VERCEL_PROJECT_ID — or connect GitHub inside Vercel."
      - name: Install
        if: env.VERCEL_TOKEN != ''
        run: npm ci
      - name: Pull
        if: env.VERCEL_TOKEN != ''
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
